services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: siliconskunk
      POSTGRES_PASSWORD: siliconskunk_dev_only
      POSTGRES_DB: siliconskunk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siliconskunk -d siliconskunk"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
